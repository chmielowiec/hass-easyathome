name: HA Canary

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        ha-channel: ["pre-release", "dev"]
    name: Canary (${{ matrix.ha-channel }}, py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Install Home Assistant pre-release
        if: matrix.ha-channel == 'pre-release'
        run: pip install --upgrade --pre homeassistant

      - name: Install Home Assistant dev
        if: matrix.ha-channel == 'dev'
        run: pip install --upgrade "git+https://github.com/home-assistant/core.git@dev"

      - name: Check dependency resolution
        run: |
          if [ "${{ matrix.ha-channel }}" = "pre-release" ]; then
            pip check
          else
            echo "Skipping pip check for dev channel (future HA versions may not have compatible test utils yet)"
            pip check || echo "Known version mismatches: dev channel tests against unreleased HA versions"
          fi

      - name: Run tests
        run: pytest tests/ --cov=custom_components.easyathome --cov-report=xml

  create-issue-on-failure:
    needs: canary
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create or update canary failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "[Canary] Weekly Home Assistant compatibility failure";
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "The weekly Home Assistant canary workflow failed.",
              "",
              `Run: ${runUrl}`,
              "",
              "Please review failures against Home Assistant pre-release and dev channels."
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            const existing = issues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
            }
